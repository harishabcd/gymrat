<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRONLOG / Athlete Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            brand: {
              DEFAULT: '#10B981',
              hover: '#059669',
              light: '#34D399',
              dim: 'rgba(16, 185, 129, 0.12)',
            }
          }
        }
      }
    }
  </script>
  <style>
    .glow-brand { box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.25); }
    .ambient-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#06090F] text-zinc-100 font-sans antialiased min-h-screen ambient-grid flex flex-col justify-center items-center px-4 py-8 relative selection:bg-brand selection:text-black">

  <div class="fixed top-1/4 -left-32 w-80 h-80 bg-emerald-500/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-1/4 -right-32 w-80 h-80 bg-emerald-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl relative glow-brand">
    <div class="flex flex-col items-center text-center mb-6">
      <div class="h-14 w-14 rounded-2xl bg-gradient-to-tr from-brand to-emerald-300 flex items-center justify-center text-zinc-950 font-mono font-black text-2xl shadow-lg shadow-emerald-500/25 mb-3">
        ⚡
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-1.5 font-mono">
        IRON<span class="text-brand">LOG</span>
      </h1>
      <p class="text-xs text-zinc-400 mt-1">Cloud-Synced Strength Progression Telemetry</p>
    </div>

    <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border flex items-start gap-2.5 transition-all">
      <i id="alert-icon" data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i>
      <span id="alert-text" class="flex-1 leading-relaxed"></span>
    </div>

    <div class="flex bg-zinc-950/80 p-1 rounded-xl border border-zinc-800 mb-6">
      <button id="tab-login" onclick="switchAuthMode('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-zinc-800 text-white transition duration-200">
        Sign In
      </button>
      <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-zinc-200 transition duration-200">
        Register
      </button>
    </div>

    <button type="button" id="btn-google" onclick="handleGoogleSignIn()" class="w-full bg-zinc-950 hover:bg-zinc-800/80 border border-zinc-700/80 hover:border-zinc-600 text-zinc-200 font-semibold py-2.5 px-4 rounded-xl transition duration-150 flex items-center justify-center gap-3 text-sm group">
      <svg class="w-4 h-4 shrink-0 transition-transform group-hover:scale-105" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="relative my-5">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-zinc-800"></div>
      </div>
      <div class="relative flex justify-center text-[10px] uppercase tracking-wider font-mono">
        <span class="bg-zinc-900 px-3 text-zinc-500">or with email</span>
      </div>
    </div>

    <form id="auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div id="field-name" class="hidden">
        <label class="block text-xs font-medium text-zinc-400 mb-1.5">Athlete Name</label>
        <div class="relative">
          <input type="text" id="input-name" placeholder="Alex Hunter" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-brand transition">
          <i data-lucide="user" class="w-4 h-4 text-zinc-500 absolute right-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1.5">Email Address</label>
        <div class="relative">
          <input type="email" id="input-email" required placeholder="lifter@ironlog.io" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-brand transition">
          <i data-lucide="mail" class="w-4 h-4 text-zinc-500 absolute right-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-brand transition pr-10">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3 text-zinc-500 hover:text-zinc-300">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-brand hover:bg-brand-hover text-zinc-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-brand/20 active:scale-[0.99] transition duration-150 flex items-center justify-center gap-2 text-sm mt-2">
        <span id="submit-spinner" class="hidden animate-spin h-4 w-4 border-2 border-zinc-950 border-t-transparent rounded-full"></span>
        <span id="submit-text">Sign In to Dashboard</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-zinc-800/80 text-center text-[11px] text-zinc-500 flex items-center justify-center gap-1.5">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 text-brand"></i>
      <span>Protected by Firebase Cloud Security</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      signInWithPopup, GoogleAuthProvider, updateProfile 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMcZEWAepTtKiIucdKmXUi2euT29XPBFM",
      authDomain: "fir-71583.firebaseapp.com",
      projectId: "fir-71583",
      storageBucket: "fir-71583.firebasestorage.app",
      messagingSenderId: "131866556311",
      appId: "1:131866556311:web:7e385874326a24071df6d2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentMode = 'login';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("index.html");
      }
    });

    window.showAlert = function(message, type = 'error') {
      const box = document.getElementById('auth-alert');
      const text = document.getElementById('alert-text');
      const icon = document.getElementById('alert-icon');
      box.classList.remove('hidden', 'bg-red-950/40', 'border-red-800/50', 'text-red-300', 'bg-emerald-950/40', 'border-emerald-800/50', 'text-emerald-300');
      if (type === 'error') {
        box.classList.add('bg-red-950/40', 'border-red-800/50', 'text-red-300');
        icon.setAttribute('data-lucide', 'alert-circle');
      } else {
        box.classList.add('bg-emerald-950/40', 'border-emerald-800/50', 'text-emerald-300');
        icon.setAttribute('data-lucide', 'check-circle-2');
      }
      text.textContent = message;
      lucide.createIcons();
    };

    window.switchAuthMode = function(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const fieldName = document.getElementById('field-name');
      const submitText = document.getElementById('submit-text');
      document.getElementById('auth-alert').classList.add('hidden');

      if (mode === 'signup') {
        tabSignup.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-zinc-800 text-white transition duration-200";
        tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-zinc-200 transition duration-200";
        fieldName.classList.remove('hidden');
        submitText.textContent = "Create Athlete Account";
      } else {
        tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-zinc-800 text-white transition duration-200";
        tabSignup.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-zinc-400 hover:text-zinc-200 transition duration-200";
        fieldName.classList.add('hidden');
        submitText.textContent = "Sign In to Dashboard";
      }
      lucide.createIcons();
    };

    window.togglePasswordVisibility = function() {
      const input = document.getElementById('input-password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    };

    function setSubmitting(loading) {
      const btn = document.getElementById('btn-submit');
      const spinner = document.getElementById('submit-spinner');
      if (loading) {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        spinner.classList.remove('hidden');
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        spinner.classList.add('hidden');
      }
    }

    function parseFirebaseError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'The email address is invalid.';
        case 'auth/user-not-found':
        case 'auth/invalid-credential': return 'Invalid credentials. Check email and password.';
        case 'auth/email-already-in-use': return 'An account already exists with this email address.';
        case 'auth/weak-password': return 'Password must be at least 6 characters.';
        case 'auth/popup-closed-by-user': return 'Sign-in window closed before completion.';
        default: return 'Authentication failed: ' + (code || 'unknown error');
      }
    }

    window.handleGoogleSignIn = async function() {
      try {
        await signInWithPopup(auth, googleProvider);
        window.location.replace("index.html");
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') showAlert(parseFirebaseError(err.code), 'error');
      }
    };

    window.handleEmailAuth = async function(event) {
      event.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value.trim();
      if (!email || !password) return;

      setSubmitting(true);
      try {
        if (currentMode === 'signup') {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          if (name && userCredential.user) {
            await updateProfile(userCredential.user, { displayName: name });
          }
          window.location.replace("index.html");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.replace("index.html");
        }
      } catch (err) {
        showAlert(parseFirebaseError(err.code), 'error');
      } finally {
        setSubmitting(false);
      }
    };

    window.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
