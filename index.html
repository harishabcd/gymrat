<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMRAT | Hypertrophy Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="landing-page" class="screen-container">
        <div class="auth-card">
            <h1>GYMRAT</h1>
            <p>Hypertrophy & Overload Engine</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password">
                    <span id="toggle-password" class="eye-icon">👁️</span>
                </div>
            </div>
            
            <p id="auth-error" class="error-text"></p>
            <p id="auth-success" class="success-text"></p>
            
            <div class="button-group">
                <button type="button" id="btn-login" class="primary-btn">Sign In</button>
                <button type="button" id="btn-signup" class="secondary-btn">Create Account</button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN APP DASHBOARD -->
    <div id="app-workspace" class="screen-container" style="display: none;">
        
        <!-- Navigation Menu -->
        <nav class="top-nav">
            <div class="nav-brand">GYMRAT</div>
            <div class="nav-links">
                <button type="button" id="nav-profile" class="nav-btn">Profile</button>
                <button type="button" id="nav-tracker" class="nav-btn active">Tracker</button>
                <button type="button" id="nav-library" class="nav-btn">Library</button>
                <button type="button" id="nav-special" class="nav-btn">Special Feature</button>
                <button type="button" id="btn-logout" class="nav-btn danger">Logout</button>
            </div>
        </nav>

        <!-- View: Profile -->
        <div id="view-profile" class="app-section" style="display: none;">
            <h2>Athlete Profile</h2>
            <div class="card">
                <p><strong>Division:</strong> Classic Physique</p>
                <p><strong>Status:</strong> Active</p>
                <!-- Future profile stats can go here -->
            </div>
            <div class="card history-section">
                <h3>Workout History & Growth</h3>
                <ul id="history-list"></ul>
            </div>
        </div>

        <!-- View: Workout Tracker -->
        <div id="view-tracker" class="app-section">
            <h2>Workout Tracker</h2>
            <div class="card logger-card">
                <label>Target Muscle Group:</label>
                <select id="muscle-group-select">
                    <option value="">-- Select Muscle --</option>
                    <option value="Chest">Chest (Push)</option>
                    <option value="Back">Back (Pull)</option>
                    <option value="Legs">Legs (Lower)</option>
                    <option value="Shoulders">Shoulders (Push)</option>
                    <option value="Arms">Arms</option>
                </select>

                <label>Exercise:</label>
                <select id="exercise-select" disabled>
                    <option value="">-- Select Exercise --</option>
                </select>

                <div class="metrics-grid">
                    <input type="number" id="exercise-weight" placeholder="Weight (kg)">
                    <input type="number" id="exercise-reps" placeholder="Reps">
                </div>
                
                <button type="button" id="btn-save-workout" class="primary-btn mt-10">Log Set to Cloud</button>
                <p id="save-status" class="success-text"></p>
            </div>
        </div>

        <!-- View: Exercise Library -->
        <div id="view-library" class="app-section" style="display: none;">
            <h2>Exercise Library</h2>
            <div class="card">
                <input type="text" id="search-library" placeholder="Search exercises (e.g., Pullover, Rack Pulls)...">
                <ul id="library-list" class="library-grid">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </div>

        <!-- View: Special Feature -->
        <div id="view-special" class="app-section" style="display: none;">
            <h2>Special Feature</h2>
            <div class="card">
                <p>Welcome to the Hypertrophy Engine. (Feature coming soon).</p>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
