<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMRAT | Hypertrophy Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 1. LANDING & LOGIN PAGE -->
    <div id="landing-page" class="screen-container">
        <div class="auth-card">
            <h1>GYMRAT</h1>
            <p>Progressive Overload & Hypertrophy Engine</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
            </div>
            
            <p id="auth-error" class="error-text"></p>
            <p id="auth-success" class="success-text"></p>
            
            <div class="button-group">
                <button type="button" id="btn-login" class="primary-btn">Sign In</button>
                <button type="button" id="btn-signup" class="secondary-btn">Create Account</button>
            </div>
        </div>
    </div>

    <!-- 2. MAIN APP DASHBOARD (Hidden until logged in) -->
    <div id="app-workspace" class="screen-container" style="display: none;">
        
        <!-- Navigation Menu -->
        <nav class="top-nav">
            <div class="nav-brand">GYMRAT Dashboard</div>
            <div class="nav-links">
                <button type="button" id="nav-logger" class="nav-btn active">Logger</button>
                <button type="button" id="nav-history" class="nav-btn">History</button>
                <button type="button" id="btn-logout" class="nav-btn danger">Logout</button>
            </div>
        </nav>

        <!-- Workout Logger View -->
        <div id="view-logger" class="app-section">
            <h2>Log a Workout</h2>
            <div class="logger-card">
                <input type="text" id="exercise-name" placeholder="Exercise Name (e.g. Squat)">
                <input type="number" id="exercise-weight" placeholder="Weight">
                <input type="number" id="exercise-reps" placeholder="Reps">
                <button type="button" id="btn-save-workout" class="primary-btn">Save to Cloud</button>
                <p id="save-status" class="success-text"></p>
            </div>
        </div>

        <!-- Workout History View (Hidden by default) -->
        <div id="view-history" class="app-section" style="display: none;">
            <h2>Your Workout History</h2>
            <div class="history-card">
                <ul id="history-list">
                    <!-- Data will load here -->
                </ul>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
